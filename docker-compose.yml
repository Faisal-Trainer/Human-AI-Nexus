services:
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    networks:
      - nexus-internal
    volumes:
      - redis_data:/data

  nexus-ai:
    build: .
    container_name: nexus_autonomous_agent
    env_file:
      - .env
    environment:
      - NEXUS_MODE=autonomous
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./memory:/app/memory
      - ./documentation:/app/documentation
      - ./agent/prompts:/app/agent/prompts
      - ./nexus/native:/app/nexus/native
    healthcheck:
      test: ["CMD", "node", "-e", "require('./cli.js')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexus-internal
    restart: unless-stopped

networks:
  nexus-internal:
    driver: bridge

volumes:
  redis_data:
